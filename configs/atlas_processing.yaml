experiment:
  name: atlas-processing
  evidence_level_max: 1
  is_mock: false
  seed: 20260731
atlas:
  version: "1.0"
  raw_dir: data/raw/atlas/v1.0
  input_file: data/raw/atlas/v1.0/crispr-cas-atlas-v1.0.json
  output_dir: data/processed/atlas/v1.0
  source_manifest: data/manifests/atlas_v1.0.yaml
  streaming_backend: stdlib_incremental_decoder
  batch_size: 10000
  strict_type_vi: true
pairing:
  require_one_effector: true
  require_one_array: true
  require_nonempty_direct_repeat: true
  require_unambiguous_subtype: true
deduplication:
  canonical_amino_acids_only: false
clustering:
  tool: mmseqs
  executable: .tools/envs/bioinformatics/bin/mmseqs
  input_file: data/processed/atlas/v1.0/cas13_exact_unique.parquet
  output_dir: data/processed/atlas/v1.0/clusters
  identities: [1.0, 0.9, 0.7, 0.5, 0.4, 0.3]
  coverage: 0.8
  coverage_mode: 0
  cluster_mode: 2
  threads: 16
splits:
  strict_identity: 0.4
  auxiliary_identities: [0.5, 0.7]
  subtype_held_out: true
  scaffold_held_out: true
  fail_on_leakage: true
msa:
  input_file: data/processed/atlas/v1.0/cas13_exact_unique.parquet
  cluster_mapping: data/processed/atlas/v1.0/clusters/identity_070/cluster_mapping.parquet
  output_dir: data/processed/atlas/v1.0/msa
  executable: .tools/envs/bioinformatics/bin/mafft
  threads: 16
  representative_identity: 0.7
  minimum_protein_length: 700
  maximum_protein_length: 1600
conservation:
  msa_dir: data/processed/atlas/v1.0/msa
  output_dir: data/processed/atlas/v1.0/conservation
  sequence_identity_threshold: 0.8
  allowed_residue_frequency: 0.05
