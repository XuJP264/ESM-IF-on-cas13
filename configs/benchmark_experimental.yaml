  - proteinmpnn
  - ligandmpnn
  - msa_profile
  - matched_random_mutation
sampling:
  temperatures: [0.1, 0.5, 1.0]
  samples_per_condition: 4
  reject_homopolymer_length: 8
statistics:
  bootstrap_replicates: 1000
  permutation_replicates: 1000
  independent_unit: scaffold

