[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "cas13-if"
version = "0.1.0.dev0"
description = "Reproducible structural, evolutionary, and RNA-aware inverse folding for Cas13"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = {text = "MIT"}
authors = [{name = "Junpeng Xu"}]
dependencies = [
  "biopython>=1.83,<2",
  "networkx>=3.2,<4",
  "numpy>=1.26,<3",
  "omegaconf>=2.3,<3",
  "pandas>=2.1,<3",
  "pyarrow>=15,<22",
  "pydantic>=2.6,<3",
  "PyYAML>=6,<7",
  "rich>=13.7,<15",
  "scipy>=1.11,<2",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = [
  "coverage[toml]>=7.4,<8",
  "mypy>=1.9,<2",
  "pre-commit>=3.6,<5",
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.5,<1",
  "types-PyYAML>=6.0,<7",
]
workflow = ["snakemake-minimal>=8,<10"]
structures = ["biotite>=1.0,<2"]

[project.scripts]
cas13-if = "cas13_if.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/cas13_if"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]
markers = [
  "real_model: requires local genuine model weights",
  "network: requires network access",
  "slow: long-running test",
]

[tool.coverage.run]
source = ["cas13_if"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 70

[tool.ruff]
target-version = "py310"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["cas13_if"]
exclude = ["third_party", "workflow"]

