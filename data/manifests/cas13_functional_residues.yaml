    source:
      title: Structural Basis for the RNA-Guided Ribonuclease Activity of CRISPR-Cas13d
      doi: 10.1016/j.cell.2018.09.001
      official_url: https://pmc.ncbi.nlm.nih.gov/articles/PMC6179368/
    construct_note: >-
      The deposited pre-cleavage ternary construct replaces all four predicted
      catalytic HEPN residues with alanine. Design constraints must restore and
      preserve the literature-supported biological residues; recovery against
      the deposited construct sequence must be reported separately.
