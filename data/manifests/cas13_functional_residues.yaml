review_status: manual_literature_review
is_mock: false
policy: >-
  These residues are literature-supported functional constraints. They are
  mapped by author/PDB residue number and checked against the deposited
  coordinate sequence. A regular-expression motif hit alone is never accepted
  as a catalytic annotation.
structures:
  6E9F:
    subtype: VI-D
    protein: EsCas13d
